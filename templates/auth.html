<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stylish Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#6a11cb,#2575fc);
      overflow:hidden;
    }

    .login-box{
      width:350px;
      padding:40px;
      background:rgba(255,255,255,0.1);
      border-radius:20px;
      backdrop-filter:blur(15px);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      color:white;
      text-align:center;
      animation:fadeIn 1s ease;
    }

    .login-box h2{
      margin-bottom:30px;
      font-size:32px;
      letter-spacing:1px;
    }

    .input-box{
      position:relative;
      margin-bottom:25px;
    }

    .input-box input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:10px;
      background:rgba(255,255,255,0.2);
      color:white;
      font-size:16px;
    }

    .input-box input::placeholder{
      color:#eee;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:white;
      color:#2575fc;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#2575fc;
      color:white;
      transform:scale(1.05);
    }

    .links{
      margin-top:20px;
      display:flex;
      justify-content:space-between;
      font-size:14px;
    }

    .links a{
      color:white;
      text-decoration:none;
      transition:0.3s;
    }

    .links a:hover{
      text-decoration:underline;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(-30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <form>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" required>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
